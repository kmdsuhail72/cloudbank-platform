apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudbank-dev
  namespace: argocd
spec:
  project: cloudbank
  source:
    repoURL: https://github.com/kmdsuhail72/cloudbank-platform.git
    targetRevision: main
    path: deploy/gitops/environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudbank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
