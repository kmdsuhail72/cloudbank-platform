  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: card-service
    spec:
      replicas: 1
      template:
        spec:
          containers:
          - name: card-service
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: jwt-public
              mountPath: /app/public-keys
