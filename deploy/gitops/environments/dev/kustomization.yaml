- target:
    kind: Deployment
    name: frontend
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: frontend
    spec:
      replicas: 1
      template:
        spec:
          containers:
          - name: frontend
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
- target:
    kind: Ingress
    name: cloudbank-ingress
  patch: |
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: cloudbank-ingress
    spec:
      ingressClassName: public
      rules:
      - host: cloudbank.local
        http:
          paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
- path: runtime-config.yaml
- target:
    kind: Ingress
    name: cloudbank-ingress
  patch: |-
    - op: remove
      path: /metadata/annotations/nginx.ingress.kubernetes.io~1rewrite-target
