apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudbank
resources:
- ../../../kubernetes
images:
- name: ghcr.io/cloudbank-platform/auth-service
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/auth-service
  newTag: bootstrap-required
- name: ghcr.io/cloudbank-platform/api-gateway
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/api-gateway
  newTag: bootstrap-required
- name: ghcr.io/cloudbank-platform/customer-service
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/customer-service
  newTag: bootstrap-required
- name: ghcr.io/cloudbank-platform/account-service
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/account-service
  newTag: bootstrap-required
- name: ghcr.io/cloudbank-platform/ledger-service
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/ledger-service
  newTag: bootstrap-required
- name: ghcr.io/cloudbank-platform/notification-service
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/notification-service
  newTag: bootstrap-required
- name: ghcr.io/cloudbank-platform/audit-fraud-service
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/audit-fraud-service
  newTag: bootstrap-required
- name: ghcr.io/cloudbank-platform/card-service
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/card-service
  newTag: bootstrap-required
- name: ghcr.io/cloudbank-platform/transaction-service
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/transaction-service
  newTag: bootstrap-required
- name: ghcr.io/cloudbank-platform/beneficiary-service
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/beneficiary-service
  newTag: bootstrap-required
- name: ghcr.io/cloudbank-platform/loan-service
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/loan-service
  newTag: bootstrap-required
- name: ghcr.io/cloudbank-platform/frontend
  newName: ghcr.io/kmdsuhail72/cloudbank-platform/frontend
  newTag: bootstrap-required
patches:
- target:
    kind: Deployment
    name: auth-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: auth-service
    spec:
      replicas: 1
      template:
        spec:
          containers:
          - name: auth-service
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: jwt-public
              mountPath: /app/public-keys
              readOnly: true
            - name: jwt-private
              mountPath: /app/private-keys
              readOnly: true
          volumes:
          - name: jwt-public
            secret:
              secretName: cloudbank-jwt-public
          - name: jwt-private
            secret:
              secretName: cloudbank-jwt-private
- target:
    kind: Deployment
    name: api-gateway
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api-gateway
    spec:
      replicas: 1
      template:
        spec:
          containers:
          - name: api-gateway
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: jwt-public
              mountPath: /app/public-keys
              readOnly: true
          volumes:
          - name: jwt-public
            secret:
              secretName: cloudbank-jwt-public
- target:
    kind: Deployment
    name: customer-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: customer-service
    spec:
      replicas: 1
      template:
        spec:
          containers:
          - name: customer-service
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            volumeMounts:
            - name: jwt-public
              mountPath: /app/public-keys
              readOnly: true
          volumes:
          - name: jwt-public
            secret:
              secretName: cloudbank-jwt-public
- target:
    kind: Deployment
    name: account-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: account-service
    spec:
      replicas: 1
      template:
        spec:
          containers:
          - name: account-service
            resources:
              requests:
                cpu: 100m
