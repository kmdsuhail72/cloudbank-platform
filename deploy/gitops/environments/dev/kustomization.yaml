- target:
    kind: Deployment
    name: beneficiary-service
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: beneficiary-service
    spec:
      replicas: 1
      template:
        spec:
          containers:
          - name: beneficiary-service
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
