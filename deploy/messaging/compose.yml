services:

  kafka-volume-init:
    image: busybox:1.36.1

    container_name: cloudbank-kafka-volume-init

    user: "0:0"

    command:
      - sh
      - -c
      - |
        chown -R 1000:1000 /tmp/kraft-combined-logs
        stat -c 'volume_owner=%u:%g mode=%a' /tmp/kraft-combined-logs

    volumes:
      - cloudbank-kafka-data:/tmp/kraft-combined-logs

    networks:
      - cloudbank-messaging


  kafka:
    image: apache/kafka:4.0.0

    container_name: cloudbank-kafka
    hostname: cloudbank-kafka

    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully

    restart: unless-stopped

    ports:
      - "127.0.0.1:19092:9092"

    environment:
      KAFKA_NODE_ID: "1"

      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://cloudbank-kafka:19092,PLAINTEXT_HOST://localhost:19092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@cloudbank-kafka:29093"

      CLUSTER_ID: "WEd1UY8EKz9t6pdQ-hGDRg"

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

      KAFKA_NUM_PARTITIONS: "3"

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: "1"

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: "1"

    volumes:
      - cloudbank-kafka-data:/tmp/kraft-combined-logs

    networks:
      - cloudbank-messaging

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s


  cloudbank-mailpit:
    image: axllent/mailpit:v1.27.8
    container_name: cloudbank-mailpit

    restart: unless-stopped

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

    networks:
      - cloudbank-messaging

    healthcheck:
      test:
        [
          "CMD",
          "/mailpit",
          "readyz"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s


volumes:

  cloudbank-kafka-data:
    name: cloudbank-kafka-data


networks:

  cloudbank-messaging:
    name: cloudbank-messaging
