apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-service
  namespace: cloudbank
  labels:
    app: loan-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loan-service
  template:
    metadata:
      labels:
        app: loan-service
    spec:
      containers:
        - name: loan-service
          image: ghcr.io/cloudbank-platform/loan-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
          envFrom:
            - configMapRef:
                name: cloudbank-config
            - secretRef:
                name: cloudbank-secrets
          readinessProbe:
            tcpSocket:
              port: 8091
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8091
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: loan-service
  namespace: cloudbank
spec:
  selector:
    app: loan-service
  ports:
    - name: http
      port: 8091
      targetPort: 8091
  type: ClusterIP
