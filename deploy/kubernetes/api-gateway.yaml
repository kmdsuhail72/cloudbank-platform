apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: cloudbank
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/cloudbank-platform/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: cloudbank-config
            - secretRef:
                name: cloudbank-secrets
          readinessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: cloudbank
spec:
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8082
      targetPort: 8082
  type: ClusterIP
