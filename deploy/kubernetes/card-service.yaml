apiVersion: apps/v1
kind: Deployment
metadata:
  name: card-service
  namespace: cloudbank
  labels:
    app: card-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: card-service
  template:
    metadata:
      labels:
        app: card-service
    spec:
      containers:
        - name: card-service
          image: ghcr.io/cloudbank-platform/card-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: cloudbank-config
            - secretRef:
                name: cloudbank-secrets
          readinessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: card-service
  namespace: cloudbank
spec:
  selector:
    app: card-service
  ports:
    - name: http
      port: 8088
      targetPort: 8088
  type: ClusterIP
