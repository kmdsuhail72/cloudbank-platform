apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cloudbank
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: ghcr.io/cloudbank-platform/notification-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8086
        envFrom:
        - configMapRef:
            name: cloudbank-config
        - secretRef:
            name: cloudbank-secrets
        readinessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8086
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cloudbank
spec:
  selector:
    app: notification-service
  ports:
  - name: http
    port: 8086
    targetPort: 8086
  type: ClusterIP
