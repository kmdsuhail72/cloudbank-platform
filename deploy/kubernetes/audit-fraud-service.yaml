apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-fraud-service
  namespace: cloudbank
  labels:
    app: audit-fraud-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-fraud-service
  template:
    metadata:
      labels:
        app: audit-fraud-service
    spec:
      containers:
        - name: audit-fraud-service
          image: ghcr.io/cloudbank-platform/audit-fraud-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: cloudbank-config
            - secretRef:
                name: cloudbank-secrets
          env:
            - name: CLOUDBANK_AUDIT_DB_HOST
              value: postgres.cloudbank.svc.cluster.local
            - name: CLOUDBANK_AUDIT_DB_PORT
              value: "5432"
            - name: CLOUDBANK_AUDIT_DB_NAME
              value: cloudbank_audit
            - name: CLOUDBANK_AUDIT_DB_USER
              value: cloudbank_audit
            - name: CLOUDBANK_AUDIT_CONSUMER_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: audit-fraud-service
  namespace: cloudbank
spec:
  selector:
    app: audit-fraud-service
  ports:
    - name: http
      port: 8087
      targetPort: 8087
  type: ClusterIP
