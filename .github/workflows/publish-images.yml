name: Publish images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'frontend/**'
      - '.github/workflows/publish-images.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service: [auth-service, api-gateway, customer-service, account-service, ledger-service, notification-service, audit-fraud-service, card-service, transaction-service, beneficiary-service, loan-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image coordinates
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}/$SERVICE" >> "$GITHUB_OUTPUT"
          if [ "$SERVICE" = frontend ]; then
            echo "context=frontend" >> "$GITHUB_OUTPUT"
          else
            echo "context=services/$SERVICE" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.context }}
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Promotion instructions
        env:
          COMMIT: ${{ github.sha }}
        run: |
          echo 'All 12 images were published successfully.' >> "$GITHUB_STEP_SUMMARY"
          echo "Promote with: python3 scripts/promote-gitops.py $COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Review and merge the overlay change into main; Argo CD then reconciles it.' >> "$GITHUB_STEP_SUMMARY"
