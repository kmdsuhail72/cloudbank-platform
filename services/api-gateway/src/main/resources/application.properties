spring.application.name=api-gateway

server.port=8082

# Downstream services
cloudbank.services.auth.base-url=${CLOUDBANK_AUTH_SERVICE_URL:http://localhost:8081}
cloudbank.services.customer.base-url=${CLOUDBANK_CUSTOMER_SERVICE_URL:http://localhost:8083}
cloudbank.services.account.base-url=${CLOUDBANK_ACCOUNT_SERVICE_URL:http://localhost:8084}
cloudbank.services.card.base-url=${CLOUDBANK_CARD_SERVICE_URL:http://localhost:8088}
cloudbank.services.transaction.base-url=${CLOUDBANK_TRANSACTION_SERVICE_URL:http://localhost:8089}
cloudbank.services.beneficiary.base-url=${CLOUDBANK_BENEFICIARY_SERVICE_URL:http://localhost:8090}
cloudbank.services.loan.base-url=${CLOUDBANK_LOAN_SERVICE_URL:http://localhost:8091}
cloudbank.services.ledger.base-url=${CLOUDBANK_LEDGER_SERVICE_URL:http://localhost:8085}

# JWT verification
cloudbank.jwt.issuer=${CLOUDBANK_JWT_ISSUER:https://auth.cloudbank.test}
cloudbank.jwt.audience=${CLOUDBANK_JWT_AUDIENCE:cloudbank-api}
cloudbank.jwt.public-key=${CLOUDBANK_JWT_PUBLIC_KEY:file:../auth-service/keys/jwt-public.pem}
