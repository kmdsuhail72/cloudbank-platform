spring.application.name=account-service

server.port=8084

spring.datasource.url=jdbc:postgresql://${CLOUDBANK_ACCOUNT_DB_HOST:localhost}:${CLOUDBANK_ACCOUNT_DB_PORT:5433}/${CLOUDBANK_ACCOUNT_DB_NAME:cloudbank_account}
spring.datasource.username=${CLOUDBANK_ACCOUNT_DB_USER:cloudbank_account}
spring.datasource.password=${CLOUDBANK_ACCOUNT_DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

cloudbank.jwt.issuer=${CLOUDBANK_JWT_ISSUER:https://auth.cloudbank.test}
cloudbank.jwt.audience=${CLOUDBANK_JWT_AUDIENCE:cloudbank-api}
cloudbank.jwt.public-key=${CLOUDBANK_JWT_PUBLIC_KEY:file:../auth-service/keys/jwt-public.pem}

cloudbank.services.customer.base-url=${CLOUDBANK_CUSTOMER_SERVICE_URL:http://localhost:8083}
