spring.application.name=auth-service

server.port=8081

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://${CLOUDBANK_DB_HOST}:${CLOUDBANK_DB_PORT}/${CLOUDBANK_DB_NAME}
spring.datasource.username=${CLOUDBANK_DB_USER}
spring.datasource.password=${CLOUDBANK_DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# JWT
cloudbank.jwt.issuer=cloudbank-auth-service
cloudbank.jwt.audience=cloudbank-api
cloudbank.jwt.access-token-ttl=15m
