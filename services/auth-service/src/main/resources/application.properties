spring.application.name=auth-service

server.port=8081

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://${CLOUDBANK_DB_HOST}:${CLOUDBANK_DB_PORT}/${CLOUDBANK_DB_NAME}
spring.datasource.username=${CLOUDBANK_DB_USER}
spring.datasource.password=${CLOUDBANK_DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# JWT
cloudbank.jwt.issuer=https://auth.cloudbank.test
cloudbank.jwt.audience=cloudbank-api
cloudbank.jwt.access-token-ttl=15m

# JWT signing keys
cloudbank.jwt.signing.private-key=${CLOUDBANK_JWT_PRIVATE_KEY:file:./keys/jwt-private.pem}
cloudbank.jwt.signing.public-key=${CLOUDBANK_JWT_PUBLIC_KEY:file:./keys/jwt-public.pem}

spring.kafka.bootstrap-servers=${CLOUDBANK_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true

cloudbank.kafka.topics.user-contact=${CLOUDBANK_USER_CONTACT_TOPIC:cloudbank.user-contact.v1}

cloudbank.outbox.publisher.enabled=${CLOUDBANK_AUTH_OUTBOX_PUBLISHER_ENABLED:false}
cloudbank.outbox.publisher.fixed-delay-ms=${CLOUDBANK_AUTH_OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
cloudbank.outbox.publisher.batch-size=${CLOUDBANK_AUTH_OUTBOX_PUBLISHER_BATCH_SIZE:20}
cloudbank.outbox.publisher.send-timeout-seconds=${CLOUDBANK_AUTH_OUTBOX_PUBLISHER_SEND_TIMEOUT_SECONDS:10}

