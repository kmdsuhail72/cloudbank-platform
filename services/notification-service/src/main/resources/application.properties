spring.application.name=notification-service

server.port=8086

spring.datasource.url=jdbc:postgresql://${CLOUDBANK_NOTIFICATION_DB_HOST:localhost}:${CLOUDBANK_NOTIFICATION_DB_PORT:5433}/${CLOUDBANK_NOTIFICATION_DB_NAME:cloudbank_notification}
spring.datasource.username=${CLOUDBANK_NOTIFICATION_DB_USER:cloudbank_notification}
spring.datasource.password=${CLOUDBANK_NOTIFICATION_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=${CLOUDBANK_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

cloudbank.kafka.topics.transfer=${CLOUDBANK_TRANSFER_TOPIC:cloudbank.transfer.v1}
cloudbank.kafka.consumer.group-id=${CLOUDBANK_NOTIFICATION_CONSUMER_GROUP:cloudbank-notification-v1}
cloudbank.kafka.consumer.enabled=${CLOUDBANK_NOTIFICATION_CONSUMER_ENABLED:false}
