spring.application.name=notification-service

server.port=8086

spring.datasource.url=jdbc:postgresql://${CLOUDBANK_NOTIFICATION_DB_HOST:localhost}:${CLOUDBANK_NOTIFICATION_DB_PORT:5433}/${CLOUDBANK_NOTIFICATION_DB_NAME:cloudbank_notification}
spring.datasource.username=${CLOUDBANK_NOTIFICATION_DB_USER:cloudbank_notification}
spring.datasource.password=${CLOUDBANK_NOTIFICATION_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.kafka.bootstrap-servers=${CLOUDBANK_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}

cloudbank.kafka.topics.transfer=${CLOUDBANK_TRANSFER_TOPIC:cloudbank.transfer.v1}
cloudbank.kafka.consumer.group-id=${CLOUDBANK_NOTIFICATION_CONSUMER_GROUP:cloudbank-notification-v1}
cloudbank.kafka.consumer.enabled=${CLOUDBANK_NOTIFICATION_CONSUMER_ENABLED:false}

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=${CLOUDBANK_NOTIFICATION_AUTO_OFFSET_RESET:latest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual_immediate

cloudbank.kafka.topics.user-contact=${CLOUDBANK_USER_CONTACT_TOPIC:cloudbank.user-contact.v1}
cloudbank.kafka.contact-consumer.group-id=${CLOUDBANK_NOTIFICATION_CONTACT_CONSUMER_GROUP:cloudbank-notification-contact-v1}
cloudbank.kafka.contact-consumer.enabled=${CLOUDBANK_NOTIFICATION_CONTACT_CONSUMER_ENABLED:false}

# Durable email delivery worker.
# Disabled by default until the SMTP path is explicitly enabled.
cloudbank.email.worker.enabled=${CLOUDBANK_EMAIL_WORKER_ENABLED:false}
cloudbank.email.worker.max-attempts=${CLOUDBANK_EMAIL_WORKER_MAX_ATTEMPTS:5}

cloudbank.email.smtp.enabled=${CLOUDBANK_EMAIL_SMTP_ENABLED:false}
cloudbank.email.from=${CLOUDBANK_EMAIL_FROM:no-reply@cloudbank.local}

spring.mail.host=${CLOUDBANK_EMAIL_SMTP_HOST:localhost}
spring.mail.port=${CLOUDBANK_EMAIL_SMTP_PORT:1025}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.test-connection=false
