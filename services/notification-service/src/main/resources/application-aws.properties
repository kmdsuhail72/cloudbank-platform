# AWS/EKS runtime profile.
# The default local profile remains unchanged.
spring.kafka.bootstrap-servers=${CLOUDBANK_KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.properties.security.protocol=${CLOUDBANK_KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${CLOUDBANK_KAFKA_SASL_MECHANISM:AWS_MSK_IAM}
spring.kafka.properties.sasl.jaas.config=${CLOUDBANK_KAFKA_SASL_JAAS_CONFIG:software.amazon.msk.auth.iam.IAMLoginModule required;}
spring.kafka.properties.sasl.client.callback.handler.class=${CLOUDBANK_KAFKA_SASL_CALLBACK_HANDLER_CLASS:software.amazon.msk.auth.iam.IAMClientCallbackHandler}

# Amazon SES SMTP runtime.
spring.mail.host=${CLOUDBANK_EMAIL_SMTP_HOST}
spring.mail.port=${CLOUDBANK_EMAIL_SMTP_PORT:587}
spring.mail.username=${CLOUDBANK_EMAIL_SMTP_USERNAME}
spring.mail.password=${CLOUDBANK_EMAIL_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=${CLOUDBANK_EMAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${CLOUDBANK_EMAIL_SMTP_STARTTLS:true}
