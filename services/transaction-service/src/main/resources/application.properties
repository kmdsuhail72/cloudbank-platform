spring.application.name=transaction-service

server.port=8089

spring.datasource.url=jdbc:postgresql://${CLOUDBANK_TRANSACTION_DB_HOST:localhost}:${CLOUDBANK_TRANSACTION_DB_PORT:5433}/${CLOUDBANK_TRANSACTION_DB_NAME:cloudbank_transaction}
spring.datasource.username=${CLOUDBANK_TRANSACTION_DB_USER:cloudbank_transaction}
spring.datasource.password=${CLOUDBANK_TRANSACTION_DB_PASSWORD:cloudbank_transaction}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

cloudbank.jwt.issuer=${CLOUDBANK_JWT_ISSUER:https://auth.cloudbank.test}
cloudbank.jwt.audience=${CLOUDBANK_JWT_AUDIENCE:cloudbank-api}
cloudbank.jwt.public-key=${CLOUDBANK_JWT_PUBLIC_KEY:file:../auth-service/keys/jwt-public.pem}

cloudbank.services.account.base-url=${CLOUDBANK_ACCOUNT_SERVICE_URL:http://localhost:8084}
