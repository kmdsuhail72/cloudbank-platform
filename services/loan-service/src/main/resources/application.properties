spring.application.name=loan-service

server.port=8091

spring.datasource.url=jdbc:postgresql://${CLOUDBANK_LOAN_DB_HOST:localhost}:${CLOUDBANK_LOAN_DB_PORT:5433}/${CLOUDBANK_LOAN_DB_NAME:cloudbank_loan}
spring.datasource.username=${CLOUDBANK_LOAN_DB_USER:cloudbank_loan}
spring.datasource.password=${CLOUDBANK_LOAN_DB_PASSWORD:cloudbank_loan}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

cloudbank.jwt.issuer=${CLOUDBANK_JWT_ISSUER:https://auth.cloudbank.test}
cloudbank.jwt.audience=${CLOUDBANK_JWT_AUDIENCE:cloudbank-api}
cloudbank.jwt.public-key=${CLOUDBANK_JWT_PUBLIC_KEY:file:../auth-service/keys/jwt-public.pem}
