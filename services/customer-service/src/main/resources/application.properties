spring.application.name=customer-service

server.port=8083

spring.datasource.url=jdbc:postgresql://${CLOUDBANK_CUSTOMER_DB_HOST:localhost}:${CLOUDBANK_CUSTOMER_DB_PORT:5433}/${CLOUDBANK_CUSTOMER_DB_NAME:cloudbank_customer}
spring.datasource.username=${CLOUDBANK_CUSTOMER_DB_USER:cloudbank_customer}
spring.datasource.password=${CLOUDBANK_CUSTOMER_DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

cloudbank.jwt.issuer=${CLOUDBANK_JWT_ISSUER:https://auth.cloudbank.test}
cloudbank.jwt.audience=${CLOUDBANK_JWT_AUDIENCE:cloudbank-api}
cloudbank.jwt.public-key=${CLOUDBANK_JWT_PUBLIC_KEY:file:../auth-service/keys/jwt-public.pem}

spring.kafka.bootstrap-servers=${CLOUDBANK_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=${CLOUDBANK_CUSTOMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.listener.ack-mode=manual
cloudbank.kafka.topics.user-contact=${CLOUDBANK_USER_CONTACT_TOPIC:cloudbank.user-contact.v1}
cloudbank.kafka.consumer.group-id=${CLOUDBANK_CUSTOMER_CONSUMER_GROUP:cloudbank-customer-v1}
cloudbank.kafka.consumer.enabled=${CLOUDBANK_CUSTOMER_CONSUMER_ENABLED:true}
