spring.application.name=ledger-service

server.port=8085

spring.datasource.url=jdbc:postgresql://${CLOUDBANK_LEDGER_DB_HOST:localhost}:${CLOUDBANK_LEDGER_DB_PORT:5433}/${CLOUDBANK_LEDGER_DB_NAME:cloudbank_ledger}
spring.datasource.username=${CLOUDBANK_LEDGER_DB_USER:cloudbank_ledger}
spring.datasource.password=${CLOUDBANK_LEDGER_DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# JWT verification
cloudbank.jwt.issuer=${CLOUDBANK_JWT_ISSUER:https://auth.cloudbank.test}
cloudbank.jwt.audience=${CLOUDBANK_JWT_AUDIENCE:cloudbank-api}
cloudbank.jwt.public-key=${CLOUDBANK_JWT_PUBLIC_KEY:file:../auth-service/keys/jwt-public.pem}

# Downstream services
cloudbank.services.account.base-url=${CLOUDBANK_ACCOUNT_SERVICE_URL:http://localhost:8084}

# Kafka
spring.kafka.bootstrap-servers=${CLOUDBANK_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true

# Transactional outbox publisher
cloudbank.kafka.topics.transfer=${CLOUDBANK_TRANSFER_TOPIC:cloudbank.transfer.v1}
cloudbank.outbox.publisher.enabled=${CLOUDBANK_OUTBOX_PUBLISHER_ENABLED:false}
cloudbank.outbox.publisher.fixed-delay-ms=${CLOUDBANK_OUTBOX_PUBLISHER_FIXED_DELAY_MS:1000}
cloudbank.outbox.publisher.batch-size=${CLOUDBANK_OUTBOX_PUBLISHER_BATCH_SIZE:20}
cloudbank.outbox.publisher.send-timeout-seconds=${CLOUDBANK_OUTBOX_PUBLISHER_SEND_TIMEOUT_SECONDS:10}
