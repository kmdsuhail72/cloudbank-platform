spring.application.name=card-service

server.port=8088

spring.datasource.url=jdbc:postgresql://${CLOUDBANK_CARD_DB_HOST:localhost}:${CLOUDBANK_CARD_DB_PORT:5433}/${CLOUDBANK_CARD_DB_NAME:cloudbank_card}
spring.datasource.username=${CLOUDBANK_CARD_DB_USER:cloudbank_card}
spring.datasource.password=${CLOUDBANK_CARD_DB_PASSWORD:cloudbank_card}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

cloudbank.jwt.issuer=${CLOUDBANK_JWT_ISSUER:https://auth.cloudbank.test}
cloudbank.jwt.audience=${CLOUDBANK_JWT_AUDIENCE:cloudbank-api}
cloudbank.jwt.public-key=${CLOUDBANK_JWT_PUBLIC_KEY:file:../auth-service/keys/jwt-public.pem}
