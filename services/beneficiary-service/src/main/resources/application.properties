spring.application.name=beneficiary-service

server.port=8090

spring.datasource.url=jdbc:postgresql://${CLOUDBANK_BENEFICIARY_DB_HOST:localhost}:${CLOUDBANK_BENEFICIARY_DB_PORT:5433}/${CLOUDBANK_BENEFICIARY_DB_NAME:cloudbank_beneficiary}
spring.datasource.username=${CLOUDBANK_BENEFICIARY_DB_USER:cloudbank_beneficiary}
spring.datasource.password=${CLOUDBANK_BENEFICIARY_DB_PASSWORD:cloudbank_beneficiary}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

cloudbank.jwt.issuer=${CLOUDBANK_JWT_ISSUER:https://auth.cloudbank.test}
cloudbank.jwt.audience=${CLOUDBANK_JWT_AUDIENCE:cloudbank-api}
cloudbank.jwt.public-key=${CLOUDBANK_JWT_PUBLIC_KEY:file:../auth-service/keys/jwt-public.pem}
