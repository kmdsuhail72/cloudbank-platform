spring.application.name=audit-fraud-service
server.port=8087

spring.datasource.url=jdbc:postgresql://${CLOUDBANK_AUDIT_DB_HOST:localhost}:${CLOUDBANK_AUDIT_DB_PORT:5433}/${CLOUDBANK_AUDIT_DB_NAME:cloudbank_audit}
spring.datasource.username=${CLOUDBANK_AUDIT_DB_USER:cloudbank_audit}
spring.datasource.password=${CLOUDBANK_AUDIT_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

spring.kafka.bootstrap-servers=${CLOUDBANK_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=${CLOUDBANK_AUDIT_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual_immediate

cloudbank.audit.consumer.enabled=${CLOUDBANK_AUDIT_CONSUMER_ENABLED:true}
cloudbank.audit.consumer.group-id=${CLOUDBANK_AUDIT_CONSUMER_GROUP:cloudbank-audit-fraud-v1}
cloudbank.kafka.topics.user-contact=${CLOUDBANK_USER_CONTACT_TOPIC:cloudbank.user-contact.v1}
cloudbank.kafka.topics.transfer=${CLOUDBANK_TRANSFER_TOPIC:cloudbank.transfer.v1}
